name: Build and deploy the archive

on:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: pages
  cancel-in-progress: true

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-node@v7
        with:
          node-version: 22
      - name: Install
        run: npm ci || npm install
        working-directory: site
      - name: Build
        run: npm run build
        working-directory: site
      # `astro build` exits 0 even when a page throws while rendering, so a broken page
      # would otherwise ship silently - it did once, on 13 Sep 2026, leaving eight pages
      # missing and 3,433 dead links. check-links.py catches exactly that, so the deploy
      # is gated on it rather than on the build's own exit code.
      - name: Check every link, anchor and contents list
        run: python3 tools/check-links.py
      # The whole archive is one book (17 October 2026): every built page is placed in site/src/data/book.json, every running head
      # and Previous/Next matches its order. tools/check-book.py resolves site/ itself, so it runs from the repository root like the
      # steps around it (the Luwinski deploy once failed on a step that used a path relative to the wrong directory).
      - name: Check every page is a chapter of the book
        run: python3 tools/check-book.py
      # THREE CHECKS THAT RAN ONLY ON THIS MACHINE (found by the 16 October 2026 plant-a-fault
      # sweep): the local gate ran them and the deploy did not, so a push from anywhere else
      # could carry a finished-but-open errand, a blanket null about someone the register holds,
      # or a published address with no page, and ship.
      - name: Check errands, null claims and published addresses
        run: |
          python3 tools/check-errands.py
          python3 tools/check-nulls.py
          python3 tools/check-addresses.py
      # The living standard on hand-written prose: the kit's checkprose.py plus a given-name supplement. The feed of who is
      # living is built here from the tracked data and the kit's living_rule.py, and written OUTSIDE the checkout; nothing
      # about a living person is committed for the gate. Exit 2 (not run) fails the step: a run that could not look is not a pass.
      - name: Check hand-written prose against the living standard
        run: python3 tools/check-prose.py
      # The register checked against itself - no external source, only dates and
      # relationships that cannot all be true at once. Contradictions fail; softer
      # observations are printed and do not.
      - name: Check the register for self-contradiction
        run: python3 tools/consistency.py
      # Narrative pages against the data. Prints only - drift is a judgement call and this
      # check cannot see a new relationship stated in words the site already uses, so a
      # clean run is not proof the pages are current. It fails nothing.
      - name: Look for pages that have fallen behind the data
        run: python3 tools/drift.py
      - uses: actions/configure-pages@v6
      - uses: actions/upload-pages-artifact@v5
        with:
          path: site/dist

  deploy:
    needs: build
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - id: deployment
        uses: actions/deploy-pages@v5
